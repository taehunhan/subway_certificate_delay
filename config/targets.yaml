timezone: Asia/Seoul
output_dir: output
recipients:
  - taehunhan@gmail.com
  - hjjang@yoonyang.com
targets:
  - id: korail
    name: 코레일
    url: https://info.korail.com/mbs/www/neo/delay/delaylist.jsp
    enabled: true
    selection_mode: korail_select
    initial_wait_until: commit
    submit_wait_until: commit
    capture_selector: div.container
    wait_selector: select[name="indate"]
    submit_selector: button[type="submit"]
  - id: seoulmetro
    name: 서울교통공사
    url: http://www.seoulmetro.co.kr/kr/delayProofList.do?menuIdx=543
    enabled: true
    selection_mode: seoulmetro_select
    initial_wait_until: commit
    submit_wait_until: commit
    capture_selector: "#contents"
    wait_selector: "#view_date"
    submit_selector: "a[href*='document.searchForm.submit']"
  - id: metro9
    name: 서울시메트로9호선
    url: https://www.metro9.co.kr/prog/delayCrtf/kor/sub01_09/list.do
    enabled: true
    selection_mode: metro9_tab
    capture_selector: "#tab_moType1"
    wait_selector: "#delayTmpl"
  - id: ui-line
    name: 우이신설도시철도
    url: https://www.ui-line.com/html/intro/intro05/intro_05_01.php
    enabled: true
    selection_mode: ui_line_tab
    capture_selector: ".bd_vlist5"
    wait_selector: ".bd_vlist5"
  - id: gtx-a-wunjeong-seoul
    name: GTX-A 운정중앙역-서울역
    url: https://www.gtx-a.com/certificateSD.do
    enabled: true
    selection_mode: gtx_fetch
    selection_value: L08
    capture_selector: ".tab-wrap.radius"
    wait_selector: ".tab-wrap.radius"
  - id: gtx-a-suseo-dongtan
    name: GTX-A 수서역-동탄역
    url: https://www.gtx-a.com/certificateSD.do
    enabled: true
    selection_mode: gtx_fetch
    selection_value: L09
    capture_selector: ".tab-wrap.radius"
    wait_selector: ".tab-wrap.radius"
  - id: dxline
    name: 신분당선
    url: https://www.shinbundang.co.kr/index.jsp?open_main=2&open_sub1=4&open_sub2=0&pageID=%2Fcustomer%2Fcustomer4.jsp&flag=
    enabled: true
    selection_mode: dxline_static
    capture_selector: ".sub_cont"
    wait_selector: ".sub_cont"
    filename_template: "dxline-{date}.png"
