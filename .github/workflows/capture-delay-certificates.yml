name: Capture Subway Delay Certificates

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run capture job
        id: capture
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python main.py --result-json "$RUNNER_TEMP/capture-result-${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Diagnose Seoul Metro connectivity
        if: ${{ failure() && steps.capture.outcome == 'failure' }}
        timeout-minutes: 4
        continue-on-error: true
        run: >-
          python -m subway_delay.diagnostics
          --capture-result "$RUNNER_TEMP/capture-result-${{ github.run_id }}-${{ github.run_attempt }}.json"
          --config config/targets.yaml
          --output-dir output/diagnostics

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subway-delay-output
          path: output/
          if-no-files-found: warn
